name: daily-sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t kbsync .

      - name: Sync the delta
        env:
          ZENDESK_HOST: ${{ secrets.ZENDESK_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FILE_SEARCH_STORE: ${{ secrets.GEMINI_FILE_SEARCH_STORE }}
        run: |
          docker run --rm \
            -e ZENDESK_HOST \
            -e GEMINI_API_KEY \
            -e GEMINI_FILE_SEARCH_STORE \
            kbsync main.py | tee run.log

      - name: Put the counts in the run summary
        if: always()
        run: |
          {
            echo "### Sync result"
            echo '```'
            grep -E 'added=|embedded |store holds|no longer published' run.log || tail -5 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
