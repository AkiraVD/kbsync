# A scheduled job, not a server: no services, no ports. The Machine wakes on
# its schedule, runs main.py once, and stops.
app = "kbsync"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Without this, a Machine that exits gets restarted, which for a job means it
# runs again immediately, and again - burning both money and API quota.
[[restart]]
  policy = "never"

# Measured peak is about 50MB, so the cheapest preset has plenty of headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
